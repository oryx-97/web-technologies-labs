<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказы — Тёплый стол</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/orders.css">
    <script src="js/dishes.js" defer></script>
    <script src="js/orders.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">Тёплый стол</a>
            <nav class="main-nav" aria-label="Основная навигация">
                <a href="index.html">Главная</a>
                <a href="lunch.html">Собрать ланч</a>
                <a href="checkout.html">Оформить заказ</a>
                <a class="active" href="orders.html" aria-current="page">Заказы</a>
            </nav>
        </div>
    </header>
    <main class="page-main container">
        <h1 class="page-title">Мои заказы</h1>
        <p id="orders-message">Загрузка заказов...</p>
        <div class="orders-table-wrap">
            <table class="orders-table">
                <thead><tr><th>№</th><th>Дата</th><th>Состав</th><th>Стоимость</th><th>Доставка</th><th>Действия</th></tr></thead>
                <tbody id="orders-list"></tbody>
            </table>
        </div>
    </main>
    <footer class="site-footer"><div class="container"><p>Тёплый стол · Москва</p></div></footer>

    <div class="modal-overlay" id="order-modal" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal-close" type="button" aria-label="Закрыть">×</button>
            <h2 id="modal-title">Заказ</h2>
            <div id="modal-content"></div>
        </div>
    </div>
</body>
</html>
